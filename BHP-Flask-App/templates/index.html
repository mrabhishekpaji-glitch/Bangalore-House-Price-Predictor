<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bangalore House Price Predictor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="main-container">


        <!-- ==============================
             HEADER
        =============================== -->

        <div class="header">

            <h1>
                Welcome to Bangalore House Price Predictor
            </h1>

            <p>
                Want to predict the price of a new house in Bangalore?
                <br>
                Try filling the details below:
            </p>

        </div>


        <!-- ==============================
             PREDICTION FORM
        =============================== -->

        <form
            method="POST"
            class="prediction-form"
        >


            <!-- FIRST ROW -->

            <div class="form-row">


                <!-- LOCATION -->

                <div class="form-group">

                    <label for="location">
                        Select the Location:
                    </label>

                    <select
                        name="location"
                        id="location"
                        required
                    >

                        <option value="">
                            Select Location
                        </option>


                        {% for location in locations %}

                        <option
                            value="{{ location }}"

                            {% if form_data.location == location %}
                                selected
                            {% endif %}
                        >

                            {{ location }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- BHK -->

                <div class="form-group">

                    <label for="bhk">
                        Enter BHK:
                    </label>

                    <input
                        type="number"
                        name="bhk"
                        id="bhk"
                        placeholder="Enter BHK"
                        min="1"
                        value="{{ form_data.bhk }}"
                        required
                    >

                </div>

            </div>


            <!-- SECOND ROW -->

            <div class="form-row">


                <!-- BATHROOMS -->

                <div class="form-group">

                    <label for="bath">
                        Enter Number of Bathrooms:
                    </label>

                    <input
                        type="number"
                        name="bath"
                        id="bath"
                        placeholder="Enter Bathrooms"
                        min="1"
                        step="1"
                        value="{{ form_data.bath }}"
                        required
                    >

                </div>


                <!-- TOTAL SQUARE FEET -->

                <div class="form-group">

                    <label for="total_sqft">
                        Enter Total Square Feet:
                    </label>

                    <input
                        type="number"
                        name="total_sqft"
                        id="total_sqft"
                        placeholder="Enter Total Square Feet"
                        min="1"
                        step="0.01"
                        value="{{ form_data.total_sqft }}"
                        required
                    >

                </div>

            </div>


            <!-- PREDICT BUTTON -->

        <div class="button-group">

            <button
                type="submit"
                class="predict-btn"
            >
                Predict Price
            </button>

            <a
                href="{{ url_for('home') }}"
                class="reset-btn"
            >
                Reset / Clear
            </a>

        </div>

        </form>


        <!-- ==============================
             PREDICTION RESULT
        =============================== -->

        {% if prediction is not none %}

        <div class="prediction-result">

            <h2>
                Estimated House Price
            </h2>

            <div class="price">

                ₹ {{ prediction }} Lakhs

            </div>

        </div>

        {% endif %}


        <!-- ==============================
             ERROR MESSAGE
        =============================== -->

        {% if error %}

        <div class="error-message">

            {{ error }}

        </div>

        {% endif %}


    </div>

</body>

</html>
